name: Publish

on:
  workflow_dispatch:
    inputs:
      song:
        description: 'The song title to publish'
        required: true
        type: string
      artist:
        description: 'The artist name to publish'
        required: true
        type: string
      chart:
        description: 'The chart fact (e.g. Billboard position) to publish'
        required: true
        type: string

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Publish fact pack entry
        run: |
          echo "Publishing Chart Flashback fact pack entry"
          echo "Artist: ${{ github.event.inputs.artist }}"
          echo "Song: ${{ github.event.inputs.song }}"
          echo "Chart: ${{ github.event.inputs.chart }}"
